<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예비 신부 결혼 캘린더</title>
<style>
  :root {
    --bg: #F7EEE1;
    --card-bg: #FFFDF8;
    --border: #E3D6C2;
    --ink: #2E2A25;
    --sub-ink: #756B5E;
    --accent: #D98A93;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 24px 64px;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Apple SD Gothic Neo', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .page {
    max-width: 1400px;
    margin: 0 auto;
    border: 1.5px solid var(--ink);
    padding: 32px 40px 48px;
    background: var(--bg);
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-size: 13px;
    line-height: 1.6;
  }

  .top-row .left b { display: block; font-size: 14px; }
  .top-row .right { text-align: right; }

  .title-block {
    text-align: center;
    margin: 18px 0 40px;
  }

  .pill {
    display: inline-block;
    background: var(--ink);
    color: var(--bg);
    font-size: 12px;
    letter-spacing: 2px;
    padding: 6px 22px;
    border-radius: 20px;
    margin-bottom: 14px;
  }

  h1.calendar-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 56px;
    letter-spacing: 14px;
    margin: 0 0 8px;
    padding-left: 14px; /* optical centering for letter-spacing */
  }

  .subtitle-tag {
    display: inline-block;
    margin-top: 4px;
    font-size: 12px;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 3px 14px;
    letter-spacing: 1px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }

  @media (max-width: 1100px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    h1.calendar-title { font-size: 36px; letter-spacing: 8px; }
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 22px;
  }

  .card .dday {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 22px;
    font-weight: bold;
  }
  .card .alt {
    font-size: 13px;
    color: var(--sub-ink);
    margin-left: 6px;
  }

  .partial-note {
    font-size: 11px;
    color: var(--accent);
    margin: 4px 0 0;
  }

  .section { margin-top: 16px; }

  .section-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: bold;
    color: var(--ink);
    border-bottom: 1.5px solid var(--accent);
    padding-bottom: 4px;
    margin-bottom: 8px;
  }

  ul.items {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  ul.items > li {
    margin-bottom: 6px;
  }

  label.item {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    font-size: 13px;
    line-height: 1.4;
    cursor: pointer;
  }

  label.item input[type="checkbox"] {
    margin-top: 2px;
    flex: none;
    width: 14px;
    height: 14px;
    accent-color: var(--ink);
  }

  label.item input:checked + span {
    text-decoration: line-through;
    color: var(--sub-ink);
  }

  ul.sub {
    list-style: none;
    margin: 4px 0 0 21px;
    padding: 0;
    border-left: 1px dashed var(--border);
    padding-left: 10px;
  }

  ul.sub li {
    font-size: 11.5px;
    color: var(--sub-ink);
    margin-bottom: 3px;
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--sub-ink);
    margin-top: 36px;
  }

  @media print {
    body { padding: 0; }
    .page { border: none; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .card { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="top-row">
    <div class="left">
      <b>결혼식, 작은 순간들이 모여</b>
      우리라는 이야기가 시작됩니다
    </div>
    <div class="right">예비 신부 결혼 캘린더</div>
  </div>

  <div class="title-block">
    <span class="pill">WEDDING PLAN</span>
    <h1 class="calendar-title">CALENDAR</h1>
    <span class="subtitle-tag">신부용</span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>체크한 항목은 이 브라우저에 자동 저장됩니다.</footer>
</div>

<script>
const ICONS = {
  "예식 준비": "💍",
  "스드메": "📸",
  "신혼집": "🏠",
  "신혼여행": "✈️",
  "부모님": "👪"
};

const MONTHS = [
  { dday: "D-12개월", alt: "6개월", sections: {
    "예식 준비": ["결혼 예산 범위 정하기","예식 시기 및 날짜 결정","양가 상견례 일정 조율","예단·예물·혼수 진행 상의","양가 지원 범위 정리"],
    "스드메": ["웨딩 플래너 여부 결정 (동행·비동행·셀프)","촬영 진행 여부 결정 (스냅·DVD·아이폰)","웨딩 촬영 컨셉 정리 (드레스·헤어·메이크업)"],
    "신혼집": ["신혼집 자금 계획 정리 (현금·대출 가능 금액 확인)"],
    "부모님": ["결혼 일정 공유하기"]
  }},
  { dday: "D-11개월", alt: "6개월", sections: {
    "예식 준비": ["웨딩홀 후보 정리 및 투어","하객 규모 대략 인원 파악","양가 상견례 진행 (장소·메뉴 확인)","예식 날짜 최종 확정"],
    "스드메": ["촬영 총 예산 범위 설정","스드메 업체 견적 비교 (패키지 구성)","스드메 상담 후 확정","스튜디오 촬영일 확정","신부 드레스 투어"],
    "신혼집": ["신혼집 주거 형태 결정 (전세·매매·월세)","신혼집 지역·교통 조건 정리 (직장 거리·출산 계획 확인)"],
    "부모님": ["상견례 일정 전달하기"]
  }},
  { dday: "D-10개월", alt: "5개월", sections: {
    "예식 준비": ["결혼 항목별 예산 정리","웨딩홀 계약 조건 확인 (보증 인원)"],
    "스드메": ["촬영 컨셉·레퍼런스 정리","본식 스냅 작가 리스트업 후 확정","신부 드레스샵 후보 리스트업"],
    "신혼집": ["신혼집 예산 계획 세우기 (주거 형태에 맞춰 현금·대출 확인)","거주 지역 후보 정리"],
    "신혼여행": ["신혼여행 방향 설정 (자유여행 or 패키지)","여행지 후보 리스트 정리","여행 시기·예산 조율","여행 코스 및 일정 구성"],
    "부모님": ["예식장 및 촬영 준비 일정 공유하기"]
  }},
  { dday: "D-9개월", alt: "5개월", sections: {
    "예식 준비": ["웨딩홀 계약 확정","혼인신고 시점 여부 결정","예물 계약 또는 제작 진행","예단 구성 및 비용 정리"],
    "스드메": ["신부 드레스 투어 후 업체 확정","촬영 헤어·메이크업 스타일 취합","촬영 일정 최종 확정","신랑 예복 준비 시작 (촬영용 대여·본식 맞춤)"],
    "신혼집": ["신혼집 매물 탐색 (부동산 방문 및 상담)"],
    "신혼여행": ["항공권 및 숙소 예약"],
    "부모님": ["예식장 및 촬영 준비 일정 공유하기"]
  }},
  { dday: "D-8개월", alt: "4개월", sections: {
    "예식 준비": ["결혼 전 건강검진 진행 (생활습관·건강 이력 확인하기)","양가 하객 명단 1차 취합",
      {text:"웨딩밴드 제작 및 구매", sub:["결혼 후에도 평생 착용하는 커플 반지","스튜디오 촬영을 위해 2~3개월 전 준비"]}],
    "스드메": ["신랑·신부 한복 상담 (맞춤·대여)","피부관리·다이어트 본격적으로 시작"],
    "신혼집": ["계약 조건 최종 확인 (부동산 중개 수수료·하자 체크)",
      {text:"계약 전 등기부 열람 (전세·매매 확인)", sub:["소유자와 계약자가 동일한지 확인","근저당(대출)이 보증금보다 많으면 위험","가압류·압류·경매 등 권리 문제 여부 확인"]}],
    "부모님": ["예단 진행 여부 최종 확인하기"]
  }},
  { dday: "D-7개월", alt: "4개월", sections: {
    "예식 준비": ["폐백 여부 최종 결정","본식 BGM 확인 (입장곡·행진곡 등)"],
    "스드메": ["촬영 헤어·스타일 확정","촬영 드레스 셀렉 및 가봉","촬영 장소·시간 최종 확인","촬영 의상 및 소품 준비 (사복·정장·한복 등)"],
    "신혼집": ["계약 조건 및 명의 확정","계약서 검토 후 계약 완료",
      {text:"계약 후 전입 신고·확정 일자 준비", sub:["확정일자: 보증금 보호 목적 (계약 후 즉시)","전입신고: 실제 거주 주소 변경 (이사 후 14일 이내)"]}],
    "부모님": ["폐백 진행 여부 최종 확인하기"]
  }},
  { dday: "D-6개월", alt: "3개월", partial: true, sections: {
    "예식 준비": ["축가 후보 정리"],
    "스드메": ["미용실 방문 (예식 1주 전 염색·커트)","네일아트 받기 (예식 3달 전)","스튜디오 촬영 진행 (당일 보증금·간식·음료 준비)","웨딩 촬영 사진 원본 확인","촬영 의상 대여시 반납 (한복·예복)"]
  }},
  { dday: "D-5개월", alt: "3개월", sections: {
    "예식 준비": ["청첩장 문구 내용 확정","청첩장 제작 (종이·모바일)","답례품 후보 및 구성 확인","포토테이블 사진 선택 후 웨딩홀 전달 (액자·사진 인화 여부 확인)"],
    "스드메": ["촬영 사진 셀렉 최종 확정 (청첩장·앨범·포토테이블에 사용)"],
    "신혼집": ["입주전 하자 점검 (전세·월세는 하자 사진 찍어두기)","가전·가구 품목 최종 확정","가전·가구 배치 계획 정리"],
    "부모님": ["청첩장 전달 드리기 (종이·모바일)"]
  }},
  { dday: "D-4개월", alt: "2개월", sections: {
    "예식 준비": ["본식 진행 순서 및 구성 정하기 (주례·축사·축가·이벤트 포함)"],
    "스드메": ["본식 헤어·스타일 취합 후 확정","본식 피부관리 시작"],
    "신혼집": ["입주 청소 업체 예약 (셀프 or 업체)","인테리어 진행 여부 확인 (도배·바닥 등)","가전·가구 및 인터넷 설치 일정 조율"],
    "신혼여행": ["여권 유효기간 및 재발급 확인","항공·숙소 예약 내역 최종 확인","비자 및 입국 조건 확인"],
    "부모님": ["최종 하객 명단 전달받기"]
  }},
  { dday: "D-3개월", alt: "2개월", sections: {
    "예식 준비": ["웨딩홀 시식 (본식 1~3개월 전)","청첩장 전달 시작하기","본식 주례·사회·축가 섭외 진행","신부 부케·부토니에 섭외","본식 식순 최종 확인","본식 음악 및 소품 준비 확정","하객 참석 여부 확인 (RSVP)"],
    "신혼집": ["입주 준비 (짐 정리 및 이사 준비)","입주 청소 진행 (이사 1~3일 전)","가전·가구 설치 일정 최종 점검 (신랑·신부 반차·연차 확인)"],
    "부모님": ["가전·가구 설치 시 도움 여부 및 일정 확인"]
  }},
  { dday: "D-2개월", alt: "1개월", sections: {
    "예식 준비": ["식순 및 BGM 최종 점검","답례품 준비 및 수량 체크","하객 명단 최종 확정","혼인신고 서류 준비","식전 영상 준비"],
    "스드메": ["본식 신랑 예복 가봉 진행 (기장·수선 체크)"],
    "신혼집": ["개인 주소 변경 정리 (카드·보험·택배 등)","입주 초기 생필품 준비 (주방용품·소형가전 등)"],
    "신혼여행": ["여행자 보험 가입 및 환전"],
    "부모님": ["혼주 한복·헤어·메이크업 예약 (양가 어머님 참칭·구두 미리 확인해두기)"]
  }},
  { dday: "D-1개월", alt: "1개월", sections: {
    "예식 준비": ["최종 리허설 점검","예식 동선 전체 확인","포토테이블 구성 준비","혼인서약서 최종 준비","식권 준비 (신랑·신부 하객 구분용)"],
    "스드메": ["신부 본식 드레스 셀렉 및 가봉 (본식 4~6주 전)","신랑 예복 핏 및 착장 점검 (본식 2~3주 전)","미용실 예약 (본식 1개월 전)","네일아트 예약 (본식 3일 전)",
      {text:"부케 최종 확인 (총 6개)", sub:["신부용 부케 1개 + 신랑측 부토니에 1개","혼주용 코사지 4개"]}],
    "신혼집": ["신혼집 주소 이전 준비 (전입신고·주소 변경 확인)","입주 생활 정보 확인 (관리비·주차·분리수거 등)"]
  }}
];

const grid = document.getElementById('grid');

MONTHS.forEach((month, mi) => {
  const card = document.createElement('div');
  card.className = 'card';

  const header = document.createElement('div');
  header.innerHTML = `<span class="dday">${month.dday}</span><span class="alt">or ${month.alt}</span>`;
  card.appendChild(header);

  if (month.partial) {
    const note = document.createElement('div');
    note.className = 'partial-note';
    note.textContent = '※ 원본 이미지 일부가 가려져 있어 항목이 불완전합니다';
    card.appendChild(note);
  }

  Object.entries(month.sections).forEach(([secName, items]) => {
    const section = document.createElement('div');
    section.className = 'section';

    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = `<span>${ICONS[secName] || ''}</span><span>${secName}</span>`;
    section.appendChild(title);

    const ul = document.createElement('ul');
    ul.className = 'items';

    items.forEach((item, ii) => {
      const isObj = typeof item === 'object';
      const text = isObj ? item.text : item;
      const id = `m${mi}-${secName}-${ii}`.replace(/\s/g, '');

      const li = document.createElement('li');
      const label = document.createElement('label');
      label.className = 'item';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = localStorage.getItem(id) === '1';
      cb.addEventListener('change', () => {
        if (cb.checked) localStorage.setItem(id, '1');
        else localStorage.removeItem(id);
      });

      const span = document.createElement('span');
      span.textContent = text;

      label.appendChild(cb);
      label.appendChild(span);
      li.appendChild(label);

      if (isObj && item.sub) {
        const subUl = document.createElement('ul');
        subUl.className = 'sub';
        item.sub.forEach(s => {
          const subLi = document.createElement('li');
          subLi.textContent = '– ' + s;
          subUl.appendChild(subLi);
        });
        li.appendChild(subUl);
      }

      ul.appendChild(li);
    });

    section.appendChild(ul);
    card.appendChild(section);
  });

  grid.appendChild(card);
});
</script>
</body>
</html>
